# =============================
# DEVELOPMENT ENVIRONMENT
# =============================

bookstore:
  replicas: 2
  tag: "3.0"
  resources:
    requests:
      cpu: "200m"        # ← Increase
      memory: "256Mi"    # ← Increase
    limits:
      cpu: "500m"        # ← Increase
      memory: "512Mi"    # ← Increase
  livenessProbe:
    initialDelaySeconds: 120   # ← Give 2 minutes
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 100   # ← Give enough time
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

postgres:
  replicas: 1
  storage:
    size: 1Gi

frontend:
  replicas: 1

ingress:
  host: dev.bookstore.local

configMap:
  name: bookstore-config
  data:
    SERVER_PORT: "8080"
    APP_NAME: "BookStore DEV"
    MAX_BOOKS: "10"